<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#111827">

    <link rel="manifest"
          href="./manifest.json">

    <title>Business Management System</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .status,
        .card,
        .form-box,
        .item {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .menu {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button.secondary {
            background: #6b7280;
        }

        button.delete {
            background: #dc2626;
            padding: 9px 12px;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin: 7px 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        label {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .stock-good {
            color: green;
            font-weight: bold;
        }

        .stock-low {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .menu {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>My Business Management System</h1>

</header>


<div class="container">


    <!-- DASHBOARD -->

    <section id="dashboard">

        <div class="status">

            Internet:
            <span id="networkStatus"></span>

        </div>


        <div class="dashboard">

            <div class="card">
                <h3>Sales</h3>
                <strong>Rs. 0</strong>
            </div>

            <div class="card">
                <h3>Purchases</h3>
                <strong>Rs. 0</strong>
            </div>

            <div class="card">
                <h3>Receivable</h3>
                <strong>Rs. 0</strong>
            </div>

            <div class="card">
                <h3>Payable</h3>
                <strong>Rs. 0</strong>
            </div>

            <div class="card">
                <h3>Cash</h3>
                <strong>Rs. 0</strong>
            </div>

            <div class="card">
                <h3>Stock</h3>
                <strong id="stockSummary">0</strong>
            </div>

        </div>


        <div class="menu">

            <button onclick="showLedgers()">
                Customers & Suppliers
            </button>

            <button onclick="showProducts()">
                Products
            </button>

            <button onclick="showSales()">
    Sales Invoice
</button>

            <button>
                Purchase Invoice
            </button>

            <button>
                Payments
            </button>

            <button>
                Reports
            </button>

        </div>

    </section>



    <!-- LEDGERS -->

    <section id="ledgersPage" class="hidden">


        <button class="secondary"
                onclick="showDashboard()">

            ← Back to Dashboard

        </button>


        <h2>Customers & Suppliers</h2>


        <div class="form-box">

            <h3>Add New Ledger</h3>


            <label>Name</label>

            <input id="ledgerName"
                   type="text"
                   placeholder="Customer or supplier name">


            <label>City</label>

            <input id="ledgerCity"
                   type="text"
                   placeholder="City">


            <label>Phone</label>

            <input id="ledgerPhone"
                   type="tel"
                   placeholder="Phone number">


            <label>Type</label>

            <select id="ledgerType">

                <option value="customer">
                    Customer
                </option>

                <option value="supplier">
                    Supplier
                </option>

            </select>


            <label>Opening Balance</label>

            <input id="openingBalance"
                   type="number"
                   placeholder="0">


            <button onclick="addLedger()">
                Save Ledger
            </button>

        </div>


        <h3>My Ledgers</h3>

        <div id="ledgerList"></div>


    </section>



    <!-- PRODUCTS -->

    <section id="productsPage" class="hidden">


        <button class="secondary"
                onclick="showDashboard()">

            ← Back to Dashboard

        </button>


        <h2>Products</h2>


        <div class="form-box">

            <h3>Add New Product</h3>


            <label>Product Name</label>

            <input id="productName"
                   type="text"
                   placeholder="Example: 20x40 Bag">


            <label>Product Code</label>

            <input id="productCode"
                   type="text"
                   placeholder="Example: B2040">


            <label>Opening Stock</label>

            <input id="openingStock"
                   type="number"
                   placeholder="0">


            <label>Purchase Price</label>

            <input id="purchasePrice"
                   type="number"
                   placeholder="0">


            <label>Selling Price</label>

            <input id="sellingPrice"
                   type="number"
                   placeholder="0">


            <label>Minimum Stock Level</label>

            <input id="minimumStock"
                   type="number"
                   placeholder="0">


            <button onclick="addProduct()">
                Save Product
            </button>

        </div>


        <h3>My Products</h3>


        <div id="productList"></div>


    </section>


</div>



<script>


/* =========================
   NETWORK STATUS
========================= */


function updateNetworkStatus() {

    const status =
        document.getElementById("networkStatus");


    if (navigator.onLine) {

        status.textContent = "Online";

        status.className = "online";

    } else {

        status.textContent = "Offline";

        status.className = "offline";

    }

}


updateNetworkStatus();


window.addEventListener(
    "online",
    updateNetworkStatus
);


window.addEventListener(
    "offline",
    updateNetworkStatus
);



/* =========================
   DATABASE
========================= */


let db;


const request =
    indexedDB.open(
        "BusinessManagementDB",
        3
    );


request.onupgradeneeded =
    function(event) {

        db = event.target.result;


        /* LEDGERS */

        if (!db.objectStoreNames.contains("ledgers")) {

            db.createObjectStore(
                "ledgers",
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }


        /* PRODUCTS */

        if (!db.objectStoreNames.contains("products")) {

            db.createObjectStore(
                "products",
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }


        /* SALES */

if (!db.objectStoreNames.contains("sales")) {
    db.createObjectStore(
        "sales",
        {
            keyPath: "id",
            autoIncrement: true
        }
    );
}

    };


request.onsuccess =
    function(event) {

        db = event.target.result;

        console.log("Database ready");

        displayLedgers();

        displayProducts();

    };


request.onerror =
    function() {

        alert(
            "Could not open local database."
        );

    };



/* =========================
   NAVIGATION
========================= */


function hideAllPages() {

    document
        .getElementById("dashboard")
        .classList.add("hidden");

    document
        .getElementById("ledgersPage")
        .classList.add("hidden");

    document
        .getElementById("productsPage")
        .classList.add("hidden");

}


function showDashboard() {

    hideAllPages();

    document
        .getElementById("dashboard")
        .classList.remove("hidden");

}


function showLedgers() {

    hideAllPages();

    document
        .getElementById("ledgersPage")
        .classList.remove("hidden");

    displayLedgers();

}


function showProducts() {

    hideAllPages();

    document
        .getElementById("productsPage")
        .classList.remove("hidden");

    displayProducts();

}



/* =========================
   ADD LEDGER
========================= */


function addLedger() {

    const name =
        document
        .getElementById("ledgerName")
        .value
        .trim();


    const city =
        document
        .getElementById("ledgerCity")
        .value
        .trim();


    const phone =
        document
        .getElementById("ledgerPhone")
        .value
        .trim();


    const type =
        document
        .getElementById("ledgerType")
        .value;


    const openingBalance =
        Number(
            document
            .getElementById("openingBalance")
            .value
        ) || 0;


    if (!name) {

        alert(
            "Please enter a name."
        );

        return;

    }


    const transaction =
        db.transaction(
            ["ledgers"],
            "readwrite"
        );


    const store =
        transaction
        .objectStore("ledgers");


    store.add({

        name: name,

        city: city,

        phone: phone,

        type: type,

        openingBalance: openingBalance,

        createdAt:
            new Date().toISOString()

    });


    transaction.oncomplete =
        function() {

            alert(
                "Ledger saved successfully."
            );


            document
                .getElementById("ledgerName")
                .value = "";


            document
                .getElementById("ledgerCity")
                .value = "";


            document
                .getElementById("ledgerPhone")
                .value = "";


            document
                .getElementById("openingBalance")
                .value = "";


            displayLedgers();

        };

}



/* =========================
   DISPLAY LEDGERS
========================= */


function displayLedgers() {

    if (!db) return;


    const transaction =
        db.transaction(
            ["ledgers"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "ledgers"
        );


    const request =
        store.getAll();


    request.onsuccess =
        function() {

            const ledgers =
                request.result;


            const list =
                document
                .getElementById(
                    "ledgerList"
                );


            list.innerHTML = "";


            if (ledgers.length === 0) {

                list.innerHTML =
                    '<div class="empty">No ledgers yet.</div>';

                return;

            }


            ledgers.forEach(
                function(ledger) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "item";


                    div.innerHTML = `

                        <h3>
                            ${ledger.name}
                        </h3>

                        <p>
                            <strong>Type:</strong>
                            ${ledger.type}
                        </p>

                        <p>
                            <strong>City:</strong>
                            ${ledger.city || "-"}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${ledger.phone || "-"}
                        </p>

                        <p>
                            <strong>
                                Opening Balance:
                            </strong>

                            Rs. ${ledger.openingBalance}
                        </p>

                        <button
                            class="delete"
                            onclick="deleteLedger(${ledger.id})">

                            Delete

                        </button>

                    `;


                    list.appendChild(div);

                }
            );

        };

}



/* =========================
   DELETE LEDGER
========================= */


function deleteLedger(id) {

    if (
        !confirm(
            "Delete this ledger?"
        )
    ) return;


    const transaction =
        db.transaction(
            ["ledgers"],
            "readwrite"
        );


    const store =
        transaction
        .objectStore("ledgers");


    store.delete(id);


    transaction.oncomplete =
        function() {

            displayLedgers();

        };

}



/* =========================
   ADD PRODUCT
========================= */


function addProduct() {

    const name =
        document
        .getElementById("productName")
        .value
        .trim();


    const code =
        document
        .getElementById("productCode")
        .value
        .trim();


    const openingStock =
        Number(
            document
            .getElementById("openingStock")
            .value
        ) || 0;


    const purchasePrice =
        Number(
            document
            .getElementById("purchasePrice")
            .value
        ) || 0;


    const sellingPrice =
        Number(
            document
            .getElementById("sellingPrice")
            .value
        ) || 0;


    const minimumStock =
        Number(
            document
            .getElementById("minimumStock")
            .value
        ) || 0;


    if (!name) {

        alert(
            "Please enter a product name."
        );

        return;

    }


    const transaction =
        db.transaction(
            ["products"],
            "readwrite"
        );


    const store =
        transaction
        .objectStore("products");


    store.add({

        name: name,

        code: code,

        openingStock: openingStock,

        currentStock: openingStock,

        purchasePrice: purchasePrice,

        sellingPrice: sellingPrice,

        minimumStock: minimumStock,

        createdAt:
            new Date().toISOString()

    });


    transaction.oncomplete =
        function() {

            alert(
                "Product saved successfully."
            );


            document
                .getElementById("productName")
                .value = "";


            document
                .getElementById("productCode")
                .value = "";


            document
                .getElementById("openingStock")
                .value = "";


            document
                .getElementById("purchasePrice")
                .value = "";


            document
                .getElementById("sellingPrice")
                .value = "";


            document
                .getElementById("minimumStock")
                .value = "";


            displayProducts();

        };

}



/* =========================
   DISPLAY PRODUCTS
========================= */


function displayProducts() {

    if (!db) return;


    const transaction =
        db.transaction(
            ["products"],
            "readonly"
        );


    const store =
        transaction.objectStore(
            "products"
        );


    const request =
        store.getAll();


    request.onsuccess =
        function() {

            const products =
                request.result;


            const list =
                document
                .getElementById(
                    "productList"
                );


            list.innerHTML = "";


            if (products.length === 0) {

                list.innerHTML =
                    '<div class="empty">No products yet.</div>';

                return;

            }


            products.forEach(
                function(product) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "item";


                    const stockClass =
                        product.currentStock <=
                        product.minimumStock
                        ? "stock-low"
                        : "stock-good";


                    div.innerHTML = `

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            <strong>Code:</strong>
                            ${product.code || "-"}
                        </p>

                        <p>
                            <strong>
                                Current Stock:
                            </strong>

                            <span class="${stockClass}">
                                ${product.currentStock}
                            </span>
                        </p>

                        <p>
                            <strong>
                                Purchase Price:
                            </strong>

                            Rs. ${product.purchasePrice}
                        </p>

                        <p>
                            <strong>
                                Selling Price:
                            </strong>

                            Rs. ${product.sellingPrice}
                        </p>

                        <p>
                            <strong>
                                Minimum Stock:
                            </strong>

                            ${product.minimumStock}
                        </p>

                        <button
                            class="delete"
                            onclick="deleteProduct(${product.id})">

                            Delete

                        </button>

                    `;


                    list.appendChild(div);

                }
            );


            updateStockSummary(products);

        };

}



/* =========================
   STOCK SUMMARY
========================= */


function updateStockSummary(products) {

    let total = 0;


    products.forEach(
        function(product) {

            total +=
                Number(
                    product.currentStock
                );

        }
    );


    document
        .getElementById(
            "stockSummary"
        )
        .textContent = total;

}



/* =========================
   DELETE PRODUCT
========================= */


function deleteProduct(id) {

    if (
        !confirm(
            "Delete this product?"
        )
    ) return;


    const transaction =
        db.transaction(
            ["products"],
            "readwrite"
        );


    const store =
        transaction
        .objectStore("products");


    store.delete(id);


    transaction.oncomplete =
        function() {

            displayProducts();

        };

}



/* =========================
   SERVICE WORKER
========================= */


if (
    "serviceWorker" in navigator
) {

    navigator.serviceWorker.register(
        "./sw.js"
    );

}
/* =========================
   SALES INVOICE
========================= */

function showSales() {
    hideAllPages();

    let salesPage = document.getElementById("salesPage");

    if (!salesPage) {
        salesPage = document.createElement("section");
        salesPage.id = "salesPage";
        salesPage.innerHTML = `
            <button class="secondary" onclick="showDashboard()">
                ← Back to Dashboard
            </button>

            <h2>Sales Invoice</h2>

            <div class="form-box">

                <label>Date</label>
                <input id="saleDate" type="date">

                <label>Customer</label>
                <select id="saleCustomer">
                    <option value="">Select Customer</option>
                </select>

                <label>Product</label>
                <select id="saleProduct" onchange="updateSalePrice()">
                    <option value="">Select Product</option>
                </select>

                <label>Quantity</label>
                <input id="saleQuantity" type="number"
                       min="1" placeholder="Quantity"
                       oninput="calculateSaleTotal()">

                <label>Selling Price</label>
                <input id="salePrice" type="number"
                       min="0" placeholder="Selling price"
                       oninput="calculateSaleTotal()">

                <label>Total</label>
                <input id="saleTotal" type="number" readonly>

                <label>Amount Received</label>
                <input id="saleReceived" type="number"
                       min="0" placeholder="Amount received"
                       oninput="calculateSaleBalance()">

                <label>Payment Account</label>
                <select id="saleAccount">
                    <option value="Cash">Cash</option>
                    <option value="Bank">Bank</option>
                    <option value="Easypaisa">Easypaisa</option>
                </select>

                <label>Receivable / Credit</label>
                <input id="saleCredit" type="number" readonly>

                <button onclick="saveSale()">
                    Save Sales Invoice
                </button>

            </div>

            <div id="saleMessage"></div>
        `;

        document.querySelector(".container").appendChild(salesPage);
    }

    salesPage.classList.remove("hidden");

    document.getElementById("saleDate").value =
        new Date().toISOString().split("T")[0];

    loadSaleCustomers();
    loadSaleProducts();
}


function loadSaleCustomers() {

    const select =
        document.getElementById("saleCustomer");

    select.innerHTML =
        '<option value="">Select Customer</option>';

    const transaction =
        db.transaction(["ledgers"], "readonly");

    const store =
        transaction.objectStore("ledgers");

    const request = store.getAll();

    request.onsuccess = function() {

        request.result
            .filter(ledger => ledger.type === "customer")
            .forEach(customer => {

                const option =
                    document.createElement("option");

                option.value = customer.id;
                option.textContent =
                    customer.name;

                select.appendChild(option);
            });
    };
}


function loadSaleProducts() {

    const select =
        document.getElementById("saleProduct");

    select.innerHTML =
        '<option value="">Select Product</option>';

    const transaction =
        db.transaction(["products"], "readonly");

    const store =
        transaction.objectStore("products");

    const request = store.getAll();

    request.onsuccess = function() {

        request.result.forEach(product => {

            const option =
                document.createElement("option");

            option.value = product.id;

            option.textContent =
                product.name +
                " (Stock: " +
                product.currentStock +
                ")";

            select.appendChild(option);
        });
    };
}


function updateSalePrice() {

    const productId =
        Number(
            document.getElementById("saleProduct").value
        );

    if (!productId) return;

    const transaction =
        db.transaction(["products"], "readonly");

    const store =
        transaction.objectStore("products");

    const request =
        store.get(productId);

    request.onsuccess = function() {

        if (request.result) {

            document.getElementById("salePrice").value =
                request.result.sellingPrice;

            calculateSaleTotal();
        }
    };
}


function calculateSaleTotal() {

    const quantity =
        Number(
            document.getElementById("saleQuantity").value
        ) || 0;

    const price =
        Number(
            document.getElementById("salePrice").value
        ) || 0;

    const total = quantity * price;

    document.getElementById("saleTotal").value =
        total;

    calculateSaleBalance();
}


function calculateSaleBalance() {

    const total =
        Number(
            document.getElementById("saleTotal").value
        ) || 0;

    const received =
        Number(
            document.getElementById("saleReceived").value
        ) || 0;

    const credit =
        Math.max(0, total - received);

    document.getElementById("saleCredit").value =
        credit;
}
function saveSale() {

    const date =
        document.getElementById("saleDate").value;

    const customerId =
        Number(document.getElementById("saleCustomer").value);

    const productId =
        Number(document.getElementById("saleProduct").value);

    const quantity =
        Number(document.getElementById("saleQuantity").value);

    const price =
        Number(document.getElementById("salePrice").value);

    const total =
        Number(document.getElementById("saleTotal").value);

    const received =
        Number(document.getElementById("saleReceived").value) || 0;

    const account =
        document.getElementById("saleAccount").value;

    if (!date || !customerId || !productId || quantity <= 0 || price < 0) {
        alert("Please fill all required fields.");
        return;
    }

    if (received > total) {
        alert("Received amount cannot be greater than invoice total.");
        return;
    }

    const credit = total - received;

    const transaction =
        db.transaction(
            ["sales", "products", "ledgers"],
            "readwrite"
        );

    const salesStore =
        transaction.objectStore("sales");

    const productsStore =
        transaction.objectStore("products");

    const ledgersStore =
        transaction.objectStore("ledgers");

    const productRequest =
        productsStore.get(productId);

    const customerRequest =
        ledgersStore.get(customerId);

    productRequest.onsuccess = function () {

        const product = productRequest.result;

        if (!product) {
            alert("Product not found.");
            transaction.abort();
            return;
        }

        if (product.currentStock < quantity) {
            alert(
                "Not enough stock. Available stock: " +
                product.currentStock
            );
            transaction.abort();
            return;
        }

        const customer = customerRequest.result;

        if (!customer) {
            alert("Customer not found.");
            transaction.abort();
            return;
        }

        const invoiceNumber =
            "INV-" +
            Date.now();

        const sale = {

            invoiceNumber: invoiceNumber,

            date: date,

            customerId: customerId,

            customerName: customer.name,

            productId: productId,

            productName: product.name,

            quantity: quantity,

            price: price,

            total: total,

            received: received,

            credit: credit,

            paymentAccount: account,

            createdAt: new Date().toISOString()
        };

        salesStore.add(sale);

        product.currentStock =
            product.currentStock - quantity;

        productsStore.put(product);
    };

    transaction.oncomplete = function () {

        document.getElementById("saleMessage").innerHTML =
            "<div class='status online'>" +
            "Invoice saved successfully! " +
            "Invoice No: " +
            "INV-" + "..." +
            "</div>";

        alert("Sales Invoice saved successfully.");

        document.getElementById("saleQuantity").value = "";
        document.getElementById("saleReceived").value = "";

        document.getElementById("saleTotal").value = "";
        document.getElementById("saleCredit").value = "";

        loadSaleProducts();
    };

    transaction.onerror = function () {

        alert(
            "There was a problem saving the invoice."
        );
    };
        }
</script>


</body>

</html>
